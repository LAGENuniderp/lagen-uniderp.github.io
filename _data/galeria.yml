# =====================================================================
# GALERIA DE ATIVIDADES
# As fotos ficam FORA do repositório, num álbum da conta da liga
# (Imgur ou Google Fotos). O site mostra um cartão por álbum com UMA
# foto de capa e o link para o álbum completo.
#
# capa: foto salva em assets/img/galeria/ (1200 px de largura, até
#   200 KB), ex.: /assets/img/galeria/simposio-2026.jpg
#   NÃO use link direto do Imgur (i.imgur.com/...): os termos de
#   uso do Imgur proíbem usá-lo para hospedar imagens de sites.
# link: endereço do álbum, ex.: https://imgur.com/a/AbC123
#   Quando a foto já foi publicada direto no site (sem álbum externo),
#   deixe link vazio (""): a foto aparece do mesmo jeito, só sem o
#   texto "Link do álbum em breve".
# data: AAAA-MM-DD, sem aspas. Coloque o álbum mais novo no topo.
#
# subsecoes (opcional, dentro de uma categoria): agrupa os álbuns em
# blocos menores, cada um com id, titulo e a própria lista de albuns
# (mesmo formato de sempre). Use quando uma categoria tiver mais de
# um tipo de atividade (ex.: Ações Comunitárias com Páscoa e ação em
# escola).
#
# Antes de publicar fotos de pacientes ou da comunidade, leia
# "Dados pessoais e direitos de imagem" no README.
# =====================================================================

