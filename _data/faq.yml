- pergunta: O que é a LAGEN?
  resposta: >-
    É a Liga Acadêmica de Gastroenterologia e Nutrologia da Uniderp, uma
    entidade estudantil do curso de Medicina. Organizamos aulas, estágios,
    ações de extensão e produção científica, estudando gastroenterologia e
    nutrologia como uma única linha: do trato digestivo ao estado
    nutricional do paciente.

- pergunta: Quem pode participar?
  resposta: >-
    Estudantes de Medicina da Uniderp regularmente matriculados, a partir do
    [PREENCHER]º semestre, aprovados no processo seletivo.

- pergunta: Quando abre o próximo processo seletivo?
  resposta: >-
    As inscrições estão fechadas até 2027. Cadastre seu e-mail na lista de
    interesse, logo acima, para receber o aviso quando o edital sair.

- pergunta: As aulas são abertas para quem não é membro?
  resposta: >-
    [PREENCHER: dizer se as aulas teóricas aceitam ouvintes e como se inscrever.]

- pergunta: A liga emite certificado?
  resposta: >-
    Sim, para membros que cumprem os critérios de frequência descritos no
    [Painel de transparência](/a-liga/transparencia/#certificacao). O site
    não emite nem armazena certificados.

- pergunta: Como falo com a diretoria?
  resposta: >-
    Pelos contatos no rodapé do site ou pela página
    [Quem somos e diretoria](/a-liga/#diretoria).
